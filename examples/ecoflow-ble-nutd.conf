listen: 0.0.0.0:3493
auth:
  username: monuser
  password: secret
web:
  enable: true
  listen: 0.0.0.0:8080
provider:
  type: eco-ble
  adapter: hci0
  scan_timeout_seconds: 8
  connect_timeout_seconds: 20
  reconnect_delay_seconds: 10
  poll_seconds: 15
  auth:
    user_id: ""
    email: user@example.com
    password: change-me
    region: auto
devices:
  - name: delta2
    description: Living Room EcoFlow DELTA 2
    model: EcoFlow DELTA 2
    mac: AA:BB:CC:DD:EE:01
    low_battery_percent: 20
    rated_power_watts: 1800
    low_runtime_seconds: 300
    low_runtime_max_percent: 50
    low_runtime_grace_seconds: 60
    stale_timeout_seconds: 60
  - name: river3
    description: Bedroom EcoFlow RIVER 3
    model: EcoFlow RIVER 3
    mac: AA:BB:CC:DD:EE:02
    low_battery_percent: 25
    low_runtime_seconds: 600
    stale_timeout_seconds: 60
